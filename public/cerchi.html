<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative OS — cerchi</title>
<style>
  :root {
    --bg: #efece6;          /* carta calda */
    --surface: #fbfaf7;
    --sunk: #e9e5de;
    --line: #dcd6cc;
    --ink: #17150f;
    --t2: #4d4840;
    --t3: #8a8378;
    --hot: #ff4f1f;          /* vermiglio: l'unico colore, dove l'app "pensa" e dove agisci */
    --hot-soft: #ffe6dc;
    --ok: #1f7a4d;
    --ease: cubic-bezier(.2,.8,.2,1);
    --mono: "Space Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--t2); background: var(--bg);
         display: grid; grid-template-columns: 260px 1fr auto; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; border-radius: 999px; }

  /* ───────── COLONNA SINISTRA: ghiera + catena ───────── */
  .left { display: flex; flex-direction: column; align-items: center; padding: 24px 16px; gap: 28px; overflow: auto; }

  /* Ghiera: le sezioni girano, quella attiva sta in alto */
  .dial { position: relative; width: 200px; height: 200px; flex: none; }
  .dial .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--line); transition: transform .6s var(--ease); }
  .dial .spot { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%;
                display: grid; place-items: center; background: var(--surface); box-shadow: 0 0 0 1px var(--line); transition: transform .6s var(--ease), background .2s, box-shadow .2s; }
  .dial .spot:hover { box-shadow: 0 0 0 1px var(--ink); }
  .dial .spot[aria-current] { background: var(--ink); color: var(--surface); box-shadow: none; }
  .dial .spot .n { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--hot); color: #fff; font: 700 10px/18px var(--mono); text-align: center; padding: 0 4px; }
  .dial .core { position: absolute; inset: 52px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 10px 30px -14px rgba(23,21,15,.25);
                display: grid; place-items: center; text-align: center; }
  .dial .core b { display: block; font: 700 15px/1.1 "Segoe UI Variable Display", system-ui; color: var(--ink); letter-spacing: -.01em; }
  .dial .core small { font: 11px var(--mono); color: var(--t3); }
  .dial .needle { position: absolute; left: 50%; top: 2px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--hot); }

  /* Catena: il percorso come cerchi su un filo */
  .chain { width: 100%; }
  .chain h4 { font: 11px var(--mono); color: var(--t3); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px 6px; }
  .step { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px; border-radius: 999px; text-align: left; }
  .step:not(:last-child)::after { content: ""; position: absolute; left: 20px; top: 34px; height: 16px; width: 2px; background: var(--line); }
  .step .c { width: 28px; height: 28px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px var(--line); background: var(--bg); display: grid; place-items: center; font: 10px var(--mono); color: var(--t3); }
  .step .l { font-size: 14px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step:hover .c { box-shadow: inset 0 0 0 2px var(--ink); }
  .step.now .c { background: var(--ink); box-shadow: none; color: var(--surface); }
  .step.now .l { color: var(--ink); font-weight: 600; }
  .ask { margin-top: auto; width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); color: var(--t3); font-size: 14px; }
  .ask kbd { margin-left: auto; font: 11px var(--mono); }

  /* ───────── BLOCCO PRINCIPALE ───────── */
  .stage { position: relative; padding: 18px 46px 18px 0; min-width: 0; display: flex; }   /* spazio per i satelliti in orbita */
  .main { position: relative; flex: 1; min-width: 0; background: var(--surface); border-radius: 36px; box-shadow: 0 0 0 1px var(--line), 0 30px 60px -40px rgba(23,21,15,.35); overflow: hidden; display: flex; flex-direction: column; }
  .inner { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .fwd { animation: fwd .36s var(--ease); } .bwd { animation: bwd .36s var(--ease); } .morph { animation: morph .4s var(--ease); }
  @keyframes fwd { from { opacity: 0; transform: translateX(32px); } }
  @keyframes bwd { from { opacity: 0; transform: translateX(-32px); } }
  @keyframes morph { from { opacity: 0; clip-path: circle(20% at 85% 12%); } to { clip-path: circle(150% at 85% 12%); } }   /* si trasforma "aprendosi" dal bottone */

  .scroll { flex: 1; overflow: auto; }
  .col { max-width: 700px; margin: 0 auto; padding: 36px 40px 80px; }
  .head { display: flex; align-items: center; gap: 18px; margin-bottom: 28px; }
  .head .tt { flex: 1; min-width: 0; }
  .kicker { font: 12px var(--mono); color: var(--t3); letter-spacing: .04em; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font: 600 12px "Segoe UI", system-ui; color: var(--hot); background: var(--hot-soft); padding: 2px 10px; border-radius: 999px; letter-spacing: 0; }
  h1 { font: 700 34px/1.1 "Segoe UI Variable Display", "Segoe UI", system-ui; color: var(--ink); letter-spacing: -.025em; }
  .lead { margin-top: 8px; color: var(--t2); }
  .orb { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--sunk); color: var(--ink); font: 700 18px/1 "Segoe UI Variable Display", system-ui; }

  /* Azione principale: un cerchio con dentro l'azione */
  .act { position: relative; display: flex; align-items: center; gap: 8px; }
  .primary { height: 52px; padding: 0 22px 0 8px; border-radius: 999px; background: var(--ink); color: var(--surface); display: inline-flex; align-items: center; gap: 12px; font-weight: 600; transition: transform .15s; }
  .primary .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--hot); display: grid; place-items: center; color: #fff; }
  .primary:hover { transform: translateY(-1px); }
  .plus { width: 52px; height: 52px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); display: grid; place-items: center; color: var(--ink); transition: transform .35s var(--ease), box-shadow .2s; }
  .plus:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .plus[aria-expanded=true] { transform: rotate(45deg); background: var(--ink); color: var(--surface); box-shadow: none; }

  /* Petali: i rami possibili sbocciano attorno al + */
  .petals { position: absolute; right: 26px; top: 26px; width: 0; height: 0; z-index: 5; pointer-events: none; }
  .petal { position: absolute; width: 76px; height: 76px; margin: -38px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 12px 24px -12px rgba(23,21,15,.3);
           display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--ink); line-height: 1.15; padding: 8px; opacity: 0; transform: translate(0,0) scale(.4); transition: transform .4s var(--ease), opacity .25s; pointer-events: none; }
  .petal svg.i { width: 16px; height: 16px; margin: 0 auto 2px; display: block; }
  .petal.best { box-shadow: 0 0 0 2px var(--hot), 0 12px 24px -12px rgba(23,21,15,.3); }
  .petal.best::after { content: "consigliato"; position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font: 10px var(--mono); color: var(--hot); white-space: nowrap; }
  .petals.on .petal { opacity: 1; pointer-events: auto; }
  /* mentre i petali sono aperti il resto si attenua: un momento di scelta, non rumore */
  .main .scroll { transition: opacity .25s, filter .25s; }
  .main.choosing .scroll { opacity: .25; filter: blur(2px); }

  h2 { font: 11px var(--mono); color: var(--t3); letter-spacing: .08em; text-transform: uppercase; margin: 34px 0 10px; display: flex; justify-content: space-between; }

  /* Elenchi: righe con un cerchio davanti */
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 10px; margin: 0 -10px; border-radius: 999px; cursor: pointer; transition: background .15s; }
  .row:hover { background: var(--sunk); }
  .row.was { background: var(--hot-soft); }
  .row .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--ink); font: 700 13px system-ui; flex: none; }
  .row:hover .av { background: var(--surface); }
  .row .mn { flex: 1; min-width: 0; }
  .row .t { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .m { font-size: 13px; color: var(--t3); }
  .row .w { font: 12px var(--mono); color: var(--t3); }
  .pill { font-size: 12px; font-weight: 600; color: var(--hot); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hot); }

  /* Oggi: l'anello del giorno */
  .today { display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: center; }
  .clock { position: relative; width: 240px; height: 240px; }
  .clock svg { width: 100%; height: 100%; }
  .clock .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .clock .mid b { font: 700 34px/1 var(--mono); color: var(--ink); letter-spacing: -.04em; }
  .clock .mid small { display: block; margin-top: 6px; font-size: 13px; color: var(--t2); }
  .clock .mid em { font-style: normal; color: var(--hot); font-weight: 600; }
  .why { font-size: 13px; color: var(--t3); margin-top: 10px; display: flex; gap: 8px; }
  .why::before { content: "✦"; color: var(--hot); }
  .hero { padding: 22px 24px; border-radius: 28px; background: var(--ink); color: var(--surface); cursor: pointer; transition: transform .2s var(--ease); }
  .hero:hover { transform: translateY(-2px); }
  .hero .lbl { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--hot); }
  .hero .t { font: 700 22px/1.25 "Segoe UI Variable Display", system-ui; margin: 6px 0 4px; letter-spacing: -.01em; }
  .hero .m { font-size: 14px; color: #c9c3b8; }
  .hero .why { color: #c9c3b8; }

  /* Mail e risposta */
  .letter { font-size: 18px; line-height: 1.7; color: var(--ink); max-width: 62ch; }
  .letter p + p { margin-top: 14px; }
  .letter mark { background: var(--hot-soft); color: inherit; border-radius: 4px; padding: 0 3px; }
  .attach { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; padding: 8px 16px 8px 8px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; color: var(--ink); }
  .attach .av { width: 30px; height: 30px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; }
  .quote { border-radius: 22px; background: var(--sunk); padding: 12px 18px; font-size: 14px; color: var(--t2); margin-bottom: 20px; }
  .quote .txt { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  textarea { width: 100%; min-height: 200px; border: 0; font-family: inherit; font-size: 18px; line-height: 1.7; color: var(--ink); resize: none; outline: none; background: transparent; }
  textarea::placeholder { color: var(--t3); }
  .suggest { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--hot); color: var(--hot); font-weight: 600; font-size: 14px; }
  .suggest:hover { background: var(--hot-soft); }
  .sugnote { font-size: 13px; color: var(--hot); margin: 4px 0 10px; display: none; }
  .sugnote.on { display: block; }
  .ring-progress { display: flex; align-items: center; gap: 14px; }
  .ring-progress svg { width: 64px; height: 64px; transform: rotate(-90deg); }
  .saved { font: 11px var(--mono); color: var(--ok); }

  /* ───────── SATELLITI e ACCESSORI ───────── */
  .sats { position: absolute; right: 19px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 14px; z-index: 4; }
  .sat { position: relative; width: 54px; height: 54px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 8px 20px -10px rgba(23,21,15,.35); display: grid; place-items: center; color: var(--ink); transition: transform .25s var(--ease), box-shadow .2s; }
  .sat:hover { transform: scale(1.08); }
  .sat[aria-pressed=true] { background: var(--ink); color: var(--surface); box-shadow: none; }
  .sat.smart::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--hot); animation: pulse 2.4s var(--ease) infinite; }
  @keyframes pulse { 0%,100% { opacity: .9; transform: scale(1); } 50% { opacity: .2; transform: scale(1.12); } }
  .sat .tip { position: absolute; right: 66px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--ink); color: var(--surface); font-size: 13px; padding: 6px 12px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .sat:hover .tip, .sat:focus-visible .tip { opacity: 1; }
  .sat.smart .tip { opacity: 1; background: var(--hot); }
  .sat.smart[aria-pressed=true] .tip, .sat.smart:not(:hover).quiet .tip { opacity: 0; }

  .accs { width: 0; overflow: hidden; transition: width .4s var(--ease); display: flex; flex-direction: column; gap: 14px; padding: 18px 0; }
  .accs.on { width: 320px; padding: 18px 18px 18px 0; overflow: auto; }
  .acc { background: var(--surface); border-radius: 28px; box-shadow: 0 0 0 1px var(--line); padding: 18px 20px 20px; animation: pop .35s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } }
  .acc .ah { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  .acc .ah .tt { flex: 1; }
  .acc .k { font: 11px var(--mono); color: var(--t3); letter-spacing: .04em; }
  .acc h3 { font: 700 17px/1.2 "Segoe UI Variable Display", system-ui; color: var(--ink); }
  .ib { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--t3); }
  .ib:hover { background: var(--sunk); color: var(--ink); }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; }
  .slots button { width: 62px; height: 62px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); font: 12px/1.2 var(--mono); color: var(--ink); display: grid; place-items: center; text-align: center; transition: all .15s; }
  .slots button:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .slots button[aria-pressed=true] { background: var(--ink); color: var(--surface); box-shadow: none; }
  .slots button.best { box-shadow: inset 0 0 0 2px var(--hot); }
  .accbtn { width: 100%; height: 44px; border-radius: 999px; background: var(--ink); color: var(--surface); font-weight: 600; margin-top: 14px; }
  .lines { width: 100%; border-collapse: collapse; font-size: 14px; }
  .lines td { padding: 8px 0; border-bottom: 1px dashed var(--line); color: var(--ink); }
  .lines td:last-child { text-align: right; font-family: var(--mono); font-size: 13px; }
  .lines tr:last-child td { border: 0; font-weight: 700; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--surface); padding: 12px 20px; border-radius: 999px; font-size: 14px; transition: all .3s var(--ease); pointer-events: none; display: flex; gap: 10px; align-items: center; }
  .toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hot); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">

<aside class="left">
  <div class="dial" id="dial" role="navigation" aria-label="Sezioni"></div>
  <div class="chain" id="chain" aria-label="Percorso"></div>
  <button class="ask"><svg class="i"><use href="#i-search"/></svg>Chiedi o cerca<kbd>Ctrl K</kbd></button>
</aside>

<div class="stage">
  <section class="main" id="main" aria-live="polite"></section>
  <div class="sats" id="sats" aria-label="Accessori suggeriti"></div>
</div>
<aside class="accs" id="accs" aria-label="Blocchi accessori"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* ───── REGOLE ─────
   stessa famiglia → il blocco si trasforma · famiglia diversa → accessorio (satellite → pannello)
   ← / cerchi della catena → si torna con memoria
   "intelligente": ogni nodo dichiara cosa serve (satelliti), cosa fare dopo (petali) e PERCHÉ */
const HUB = new Set(['list', 'client', 'project'])
const FAMILY = { mail: 'comm', reply: 'comm', project: 'work', task: 'work', client: 'people', design: 'studio' }
const KIND = { list: '', mail: 'mail', reply: 'risposta', client: 'cliente', project: 'progetto', task: 'task', design: 'design' }
const SECTIONS = [['oggi', 'Oggi', 'sun'], ['messaggi', 'Messaggi', 'inbox'], ['clienti', 'Clienti', 'users'], ['lavori', 'Lavori', 'check'], ['studio', 'Studio', 'pen'], ['archivio', 'Archivio', 'archive']]

const D = {
  oggi: { kind: 'list', title: 'Oggi' },
  messaggi: { kind: 'list', title: 'Messaggi', lead: 'Ordinati per quanto contano, non per data.', groups: [['Da rispondere', ['m1', 'm2']], ['Letti', ['m3']]] },
  clienti: { kind: 'list', title: 'Clienti', lead: 'Prima chi aspetta una tua risposta.', groups: [['Attivi', ['c1', 'c2', 'c3']]] },
  lavori: { kind: 'list', title: 'Lavori', lead: 'Questa settimana', groups: [['In scadenza', ['t1', 't2', 't3']], ['Progetti', ['p1']]] },
  studio: { kind: 'list', title: 'Studio', lead: 'Design recenti', groups: [['Recenti', ['g1', 'g2']]] },
  archivio: { kind: 'list', title: 'Archivio', lead: 'Note, idee e file', groups: [['Recenti', []]] },

  m1: { kind: 'mail', title: 'Preventivo logo', who: 'Mario Rossi', ini: 'MR', client: 'c1', urgent: 'da rispondere', when: 'ieri 18:42', file: 'brief-rossi.pdf',
        html: ['Ciao! Avremmo bisogno di un <mark>preventivo</mark> per il restyling del logo e delle grafiche social, entro fine mese.', 'Ti allego il brief. <mark>Possiamo sentirci la prossima settimana</mark> per parlarne?'],
        sats: [['client', 'c1', 'Rossi Srl'], ['calendar', null, 'Chiede di sentirvi → proponi un orario', true], ['quote', null, 'Chiede un preventivo']],
        petals: [['Preventivo', 'euro', 'quote', true], ['Evento', 'cal', 'calendar'], ['Task', 'check', 'task']],
        draft: 'Ciao Mario,\n\ngrazie per il brief! Ti preparo il preventivo per logo e grafiche social entro lunedì.\n\nPer sentirci: ti va bene martedì alle 11:00?\n\nA presto' },
  m2: { kind: 'mail', title: 'Foto nuova collezione', who: 'Luca Ferri', ini: 'LF', client: 'c2', urgent: 'da rispondere', when: 'oggi 9:10',
        html: ['Ti mando le foto per i post di novembre. Fammi sapere se servono altri scatti.'], sats: [['client', 'c2', 'Bicicleria']], petals: [['Task', 'check', 'task', true]],
        draft: 'Ciao Luca, ricevute! Le guardo oggi e ti dico entro domani se servono altri scatti.' },
  m3: { kind: 'mail', title: 'Conferma call', who: 'Anna Mossetto', ini: 'AM', client: 'c3', when: 'oggi 8:02', html: ['Confermo la call di domani alle 10.'], sats: [['client', 'c3', 'Mossetto']], petals: [], draft: 'Perfetto, a domani!' },
  c1: { kind: 'client', title: 'Rossi Srl', ini: 'RS', lead: 'Mario Rossi · aspetta una tua risposta da ieri', items: [['Prossima cosa', ['m1']], ['Progetti', ['p1']], ['Design', ['g1']]], sats: [['quote', null, 'Preventivo in bozza']], petals: [['Progetto', 'file', 'project', true], ['Preventivo', 'euro', 'quote']] },
  c2: { kind: 'client', title: 'Bicicleria', ini: 'BI', lead: 'Luca Ferri · 1 lavoro in corso', items: [['Prossima cosa', ['m2']], ['Lavori', ['t2']]], sats: [], petals: [] },
  c3: { kind: 'client', title: 'Mossetto', ini: 'MO', lead: 'Anna Mossetto · call domani', items: [['Messaggi', ['m3']]], sats: [], petals: [] },
  p1: { kind: 'project', title: 'Restyling logo', ini: 'RL', lead: 'Rossi Srl · consegna 31 ottobre · al ritmo attuale sei in tempo', client: 'c1', progress: .35, items: [['Task', ['t1', 't3']], ['Design', ['g1', 'g2']]], sats: [['client', 'c1', 'Rossi Srl']], petals: [['Task', 'check', 'task', true], ['Design', 'pen', 'design']] },
  t1: { kind: 'task', title: 'Consegnare moodboard', meta: 'Restyling logo', when: 'oggi', parent: 'p1', client: 'c1', sats: [['client', 'c1', 'Rossi Srl']], petals: [] },
  t2: { kind: 'task', title: 'Post di novembre', meta: 'Bicicleria', when: 'ven', client: 'c2', sats: [['client', 'c2', 'Bicicleria']], petals: [] },
  t3: { kind: 'task', title: 'Varianti colore', meta: 'Restyling logo', when: 'lun', parent: 'p1', client: 'c1', sats: [], petals: [] },
  g1: { kind: 'design', title: 'Logo — variante B', meta: 'Restyling logo', when: 'ieri', client: 'c1', sats: [['client', 'c1', 'Rossi Srl']], petals: [] },
  g2: { kind: 'design', title: 'Logo — variante A', meta: 'Restyling logo', when: '3 gg', client: 'c1', sats: [], petals: [] },
}

let chain = [], accs = [], petalsOpen = false
const drafts = {}
const cur = () => chain[chain.length - 1]
const ico = n => `<svg class="i"><use href="#i-${n}"/></svg>`
const stepName = s => s.kind === 'reply' ? 'Risposta' : D[s.id].title

function remember() { const c = cur(); if (!c) return; const s = document.querySelector('#main .scroll'); if (s) c.mem.scroll = s.scrollTop; const ta = document.querySelector('#main textarea'); if (ta) drafts[c.id] = ta.value }
function go(id, kind = D[id].kind) {
  const here = cur()
  if (here && !(HUB.has(here.kind) || FAMILY[here.kind] === FAMILY[kind])) return openAcc(kind === 'client' ? 'client' : kind, id)
  remember(); if (here) here.mem.from = id
  const anim = here && here.id === id ? 'morph' : 'fwd'
  chain.push({ id, kind, mem: {} }); petalsOpen = false; render(anim)
}
function back(to = chain.length - 2) { if (to < 0 || to >= chain.length - 1) return; remember(); chain = chain.slice(0, to + 1); petalsOpen = false; render('bwd') }
function openAcc(kind, id) {
  const key = kind + ':' + (id ?? '')
  if (accs.some(a => a.key === key)) { accs = accs.filter(a => a.key !== key) }
  else { accs.unshift({ key, kind, id, for: cur().id }); accs = accs.slice(0, 2) }
  renderAccs(); renderSats()
}

/* ───── Ghiera ───── */
function renderDial() {
  const active = SECTIONS.findIndex(s => s[0] === chain[0].id)
  const counts = { messaggi: Object.values(D).filter(n => n.kind === 'mail' && n.urgent).length }
  const R = 77, step = 360 / SECTIONS.length
  const spots = SECTIONS.map(([id, label, icon], i) => {
    const a = ((i - active) * step - 90) * Math.PI / 180      // l'attiva sempre in alto
    return `<button class="spot" data-root="${id}" aria-label="${label}" title="${label}" ${i === active ? 'aria-current="true"' : ''}
      style="transform: translate(${Math.cos(a) * R}px, ${Math.sin(a) * R}px)">${ico(icon)}${counts[id] ? `<span class="n">${counts[id]}</span>` : ''}</button>`
  }).join('')
  document.getElementById('dial').innerHTML = `<div class="ring"></div><span class="needle"></span>${spots}
    <div class="core"><div><b>${SECTIONS[active][1]}</b><small>${chain.length > 1 ? `${chain.length - 1} passi` : 'inizio'}</small></div></div>`
}

/* ───── Catena ───── */
function renderChain() {
  document.getElementById('chain').innerHTML = chain.length < 2 ? '' : `<h4>Percorso</h4>` + chain.map((s, i) =>
    `<button class="step ${i === chain.length - 1 ? 'now' : ''}" data-to="${i}" ${i === chain.length - 1 ? 'aria-current="step"' : ''}><span class="c">${i + 1}</span><span class="l">${stepName(s)}</span></button>`).join('')
}

/* ───── Righe ───── */
function row(id) {
  const n = D[id], was = cur().mem.from === id ? ' was' : ''
  const av = n.ini ?? ''
  const avHtml = av ? av : ico({ task: 'check', design: 'pen', project: 'file' }[n.kind] ?? 'file')
  const sub = n.kind === 'mail' ? `${n.who} · ${n.when}` : [KIND[n.kind], n.meta].filter(Boolean).join(' · ')
  const right = n.urgent ? `<span class="pill">${n.urgent}</span>` : `<span class="w">${n.when ?? ''}</span>`
  return `<div class="row${was}" data-go="${id}" tabindex="0"><span class="av">${avHtml}</span><div class="mn"><div class="t">${n.title}</div><div class="m">${sub}</div></div>${right}</div>`
}
const group = ([l, ids]) => `<h2>${l}<span>${ids.length}</span></h2>` + (ids.length ? ids.map(row).join('') : `<p style="color:var(--t3)">Ancora niente qui.</p>`)

/* Anello del giorno: 8:00 → 20:00 = un giro */
function clock() {
  const C = 2 * Math.PI * 100, toFrac = h => (h - 8) / 12
  const arc = (from, to, color, w) => `<circle cx="120" cy="120" r="100" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"
     stroke-dasharray="${(toFrac(to) - toFrac(from)) * C} ${C}" stroke-dashoffset="${-toFrac(from) * C}" transform="rotate(-90 120 120)"/>`
  const now = 9 + 40 / 60, a = (toFrac(now) * 360 - 90) * Math.PI / 180
  const ticks = Array.from({ length: 13 }, (_, i) => { const b = (i / 12 * 360 - 90) * Math.PI / 180; return `<circle cx="${120 + Math.cos(b) * 116}" cy="${120 + Math.sin(b) * 116}" r="${i % 3 ? 1.2 : 2}" fill="var(--t3)"/>` }).join('')
  return `<div class="clock" aria-label="Giornata: call alle 10, lavoro dalle 15:30 alle 17:30, ora sono le 9:40"><svg viewBox="0 0 240 240">
    <circle cx="120" cy="120" r="100" fill="none" stroke="var(--sunk)" stroke-width="14"/>${ticks}
    ${arc(8, now, 'var(--line)', 14)}${arc(10, 10.5, 'var(--ink)', 14)}${arc(15.5, 17.5, 'var(--ink)', 14)}
    <circle cx="${120 + Math.cos(a) * 100}" cy="${120 + Math.sin(a) * 100}" r="9" fill="var(--hot)" stroke="var(--surface)" stroke-width="3"/>
    </svg><div class="mid"><div><b>9:40</b><small>tra 20 min<br><em>Call con Anna</em></small></div></div></div>`
}
function progressRing(p) {
  const C = 2 * Math.PI * 26
  return `<div class="ring-progress"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--sunk)" stroke-width="6"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="var(--hot)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${p * C} ${C}"/></svg>
    <div><b style="color:var(--ink);font:700 20px var(--mono)">${Math.round(p * 100)}%</b><div style="font-size:13px;color:var(--t3)">2 task su 6 · in tempo</div></div></div>`
}

function view(c) {
  const n = D[c.id]
  if (c.id === 'oggi') {
    const m = D.m1
    return { kicker: 'venerdì 9 ottobre', title: 'Buongiorno', lead: 'Due persone aspettano una tua risposta. Prima della call hai 20 minuti.',
      body: `<div class="today">${clock()}<div>
        <div class="hero" data-go="m1" tabindex="0"><div class="lbl">Inizia da qui</div><div class="t">Rispondi a Mario Rossi</div>
        <div class="m">"Preventivo logo" · ieri 18:42</div><div class="why">chiede preventivo e appuntamento: bastano 20 min</div></div></div></div>
        <h2>Poi<span>3</span></h2>${['t1', 'm2', 't2'].map(row).join('')}` }
  }
  if (c.kind === 'list') return { title: n.title, lead: n.lead, body: n.groups.map(group).join('') }
  const actions = {
    mail: `<button class="primary" data-morph="reply"><span class="dot">${ico('reply')}</span>Rispondi</button>`,
    reply: `<button class="primary" data-send><span class="dot">${ico('send')}</span>Invia</button>`,
    client: `<button class="primary"><span class="dot">${ico('plus')}</span>Nuovo</button>`,
    project: `<button class="primary"><span class="dot">${ico('plus')}</span>Nuovo task</button>`,
    task: `<button class="primary"><span class="dot">${ico('check')}</span>Fatto</button>`,
    design: `<button class="primary"><span class="dot">${ico('pen')}</span>Apri</button>`,
  }
  const plus = (n.petals?.length && c.kind !== 'reply') ? `<button class="plus" data-petals aria-expanded="${petalsOpen}" aria-label="Rami possibili" title="Cosa puoi fare da qui">${ico('plus')}</button>` : ''
  const action = `<div class="act">${plus}${actions[c.kind]}</div>`
  if (c.kind === 'mail') return { kicker: `mail · ${D[n.client].title}`, title: n.title, orb: n.ini, action,
    body: `<p style="font-size:14px;color:var(--t3);margin:-14px 0 22px">${n.who} · ${n.when}</p><div class="letter">${n.html.map(p => `<p>${p}</p>`).join('')}</div>
      ${n.file ? `<div class="attach"><span class="av">${ico('file')}</span>${n.file}</div>` : ''}
      ${n.html.some(p => p.includes('mark')) ? `<p class="why" style="margin-top:24px">ho evidenziato le richieste: trovi gli strumenti a destra, nei cerchi</p>` : ''}` }
  if (c.kind === 'reply') return { kicker: `<span class="tag">stessa mail · ora rispondi</span>${drafts[c.id] ? '<span class="saved">● bozza salvata</span>' : ''}`, title: `Risposta a ${n.who.split(' ')[0]}`, orb: n.ini, action,
    body: `<div class="quote"><b style="color:var(--ink)">${n.who}:</b> <span class="txt">${n.html.join(' ').replace(/<[^>]+>/g, '')}</span></div>
      ${drafts[c.id] ? '' : `<button class="suggest" data-suggest>${ico('spark')}Suggerisci una bozza</button>`}
      <p class="sugnote" id="sugnote">✦ bozza suggerita da quello che chiede Mario: rileggila prima di inviare</p>
      <textarea id="draft" placeholder="Scrivi la risposta…" aria-label="Risposta">${drafts[c.id] ?? ''}</textarea>` }
  if (c.kind === 'client' || c.kind === 'project') return { kicker: KIND[c.kind], title: n.title, lead: n.lead, orb: n.ini, action,
    body: (n.progress ? progressRing(n.progress) : '') + n.items.map(group).join('') }
  if (c.kind === 'task') return { kicker: `task · ${n.meta}`, title: n.title, lead: `Scadenza: ${n.when}`, action, body: `<h2>Checklist<span>0/2</span></h2>${['Raccogliere i riferimenti', 'Impaginare la moodboard'].map(t => `<div class="row" style="cursor:default"><span class="av" style="background:none;box-shadow:inset 0 0 0 1.5px var(--line)"></span><div class="mn"><div class="t" style="font-weight:500">${t}</div></div></div>`).join('')}` }
  if (c.kind === 'design') return { kicker: `design · ${n.meta}`, title: n.title, action, body: `<div style="aspect-ratio:1;max-width:420px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--t3);margin:0 auto">anteprima</div>` }
}

function render(anim) {
  const c = cur(), v = view(c)
  document.getElementById('main').innerHTML = `<div class="inner ${anim}"><div class="scroll"><div class="col">
    <div class="head">${v.orb ? `<span class="orb">${v.orb}</span>` : ''}<div class="tt">${v.kicker ? `<div class="kicker">${v.kicker}</div>` : ''}<h1>${v.title}</h1>${v.lead ? `<p class="lead">${v.lead}</p>` : ''}</div>${v.action ?? ''}</div>
    ${v.body}</div></div><div class="petals ${petalsOpen ? 'on' : ''}" id="petals"></div></div>`
  document.querySelector('#main .scroll').scrollTop = c.mem.scroll ?? 0
  const ta = document.getElementById('draft')
  if (ta) { ta.focus(); ta.oninput = () => { drafts[c.id] = ta.value } }
  document.getElementById('main').classList.toggle('choosing', petalsOpen)
  renderPetals(); renderDial(); renderChain(); renderSats()
}

/* Petali: si aprono a ventaglio sotto-sinistra del + */
function renderPetals() {
  const n = D[cur().id], el = document.getElementById('petals'); if (!el || !n.petals) return
  const plus = document.querySelector('[data-petals]'); if (!plus) return
  const main = document.getElementById('main').getBoundingClientRect(), p = plus.getBoundingClientRect()
  el.style.right = (main.right - (p.left + p.width / 2)) + 'px'; el.style.top = (p.top + p.height / 2 - main.top) + 'px'
  const k = n.petals.length
  el.innerHTML = n.petals.map(([label, icon, kind, best], i) => {
    const ang = (100 + (k === 1 ? 40 : i * 80 / (k - 1))) * Math.PI / 180, r = 118
    const tr = petalsOpen ? `translate(${Math.cos(ang) * r}px, ${Math.sin(ang) * r}px) scale(1)` : ''
    return `<button class="petal ${best ? 'best' : ''}" data-petal="${kind}" style="${tr ? `transform:${tr};transition-delay:${i * 40}ms` : ''}">${ico(icon)}${label}</button>`
  }).join('')
}

/* Satelliti: accessori suggeriti per QUESTO nodo; il più utile si accende e dice perché */
function renderSats() {
  const c = cur(), n = D[c.id]
  const list = c.kind === 'reply' ? D[c.id].sats.filter(s => s[0] !== 'client') : (n.sats ?? [])
  const icon = { client: 'users', calendar: 'cal', quote: 'euro' }
  document.getElementById('sats').innerHTML = list.map(([kind, id, tip, smart]) => {
    const key = kind + ':' + (id ?? ''), open = accs.some(a => a.key === key)
    const label = kind === 'client' ? `<span style="font:700 13px system-ui">${D[id].ini}</span>` : ico(icon[kind])
    return `<button class="sat ${smart && !open ? 'smart' : ''}" data-sat="${kind}" data-id="${id ?? ''}" aria-pressed="${open}" aria-label="${tip}">${label}<span class="tip">${tip}</span></button>`
  }).join('')
}

function renderAccs() {
  const el = document.getElementById('accs')
  el.classList.toggle('on', accs.length > 0)
  el.innerHTML = accs.map((a, i) => {
    const forName = D[a.for]?.title ?? ''
    if (a.kind === 'calendar') return acc(i, `per · ${forName}`, 'Proponi un orario', `
      <div class="slots">${[['lun', '10:00'], ['lun', '15:00'], ['mar', '11:00', 1], ['mar', '16:30'], ['mer', '9:30']].map(([d, h, best]) => `<button data-slot="${d} ${h}" aria-pressed="false" class="${best ? 'best' : ''}">${d}<br>${h}</button>`).join('')}</div>
      <p class="why">martedì 11:00 è libero per entrambi</p>
      <button class="accbtn" data-insert>Inserisci nella risposta</button>`)
    if (a.kind === 'quote') return acc(i, `per · ${forName}`, 'Preventivo', `
      <table class="lines"><tr><td>Logo, 3 varianti</td><td>€ 900</td></tr><tr><td>Grafiche social × 6</td><td>€ 340</td></tr><tr><td>Totale</td><td>€ 1.240</td></tr></table>
      <p class="why">voci ricavate dal brief allegato</p><button class="accbtn" data-attach>Allega alla risposta</button>`)
    if (a.kind === 'task') return acc(i, `da · ${forName}`, 'Nuovo task', `<p>«Preparare preventivo Rossi»</p><p class="why">collegato a questa mail</p><button class="accbtn" data-maketask>Crea</button>`)
    if (!a.id) return acc(i, `da · ${forName}`, `Nuovo ${KIND[a.kind] || a.kind}`, `<p class="why">sarà collegato a ${forName}</p><button class="accbtn" data-maketask>Crea</button>`)
    const n = D[a.id]
    return acc(i, KIND[n.kind], n.title, `<p>${n.lead ?? ''}</p><button class="accbtn" data-promote="${i}">Apri al centro</button>`)
  }).join('')
}
const acc = (i, k, title, body) => `<section class="acc"><div class="ah"><div class="tt"><div class="k">${k}</div><h3>${title}</h3></div>
  <button class="ib" title="Chiudi (Esc)" data-close="${i}">${ico('x')}</button></div>${body}</section>`

function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2000) }
function ensureReply() { const c = cur(); if (c.kind === 'mail') go(c.id, 'reply'); return document.getElementById('draft') }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-morph],[data-sat],[data-to],[data-root],[data-close],[data-promote],[data-slot],[data-insert],[data-attach],[data-send],[data-petals],[data-petal],[data-suggest],[data-maketask]')
  if (!t) { if (petalsOpen) { petalsOpen = false; renderPetalsState() } return }
  const d = t.dataset
  if ('root' in d) { remember(); chain = [{ id: d.root, kind: 'list', mem: {} }]; accs = []; petalsOpen = false; renderAccs(); render('morph') }
  else if ('to' in d) back(+d.to)
  else if ('morph' in d) go(cur().id, d.morph)
  else if ('go' in d) go(d.go)
  else if ('sat' in d) openAcc(d.sat, d.id || null)
  else if ('petals' in d) { petalsOpen = !petalsOpen; renderPetalsState() }
  else if ('petal' in d) { petalsOpen = false; renderPetalsState(); openAcc(d.petal, null) }
  else if ('close' in d) { accs.splice(+d.close, 1); renderAccs(); renderSats() }
  else if ('promote' in d) { const a = accs.splice(+d.promote, 1)[0]; renderAccs(); remember(); cur().mem.from = a.id; chain.push({ id: a.id, kind: D[a.id].kind, mem: {} }); petalsOpen = false; render('fwd') }
  else if ('slot' in d) t.parentElement.querySelectorAll('[data-slot]').forEach(b => b.setAttribute('aria-pressed', b === t))
  else if ('insert' in d) { const s = document.querySelector('[data-slot][aria-pressed=true]') ?? document.querySelector('[data-slot].best'); const ta = ensureReply(); if (!ta) return toast('Apri la mail per rispondere'); ta.value = (ta.value ? ta.value.trimEnd() + '\n\n' : '') + `Ti va bene ${s.dataset.slot.replace('lun', 'lunedì').replace('mar', 'martedì').replace('mer', 'mercoledì')}?`; ta.dispatchEvent(new Event('input')); toast('Orario inserito nella risposta') }
  else if ('attach' in d) { if (!ensureReply()) return toast('Apri la mail per allegarlo'); toast('Preventivo allegato') }
  else if ('maketask' in d) { accs = accs.filter(a => a.kind !== 'task'); renderAccs(); renderSats(); toast('Creato e collegato') }
  else if ('suggest' in d) { const ta = document.getElementById('draft'); typeOut(ta, D[cur().id].draft); t.remove(); document.getElementById('sugnote').classList.add('on') }
  else if ('send' in d) { delete drafts[cur().id]; D[cur().id].urgent = null; accs = []; renderAccs(); toast('Inviata. Ti riporto da dove eri partito'); back(0) }
})
function renderPetalsState() { document.getElementById('main').classList.toggle('choosing', petalsOpen); const b = document.querySelector('[data-petals]'); if (b) b.setAttribute('aria-expanded', petalsOpen); document.getElementById('petals')?.classList.toggle('on', petalsOpen); renderPetals() }
function typeOut(ta, text) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { ta.value = text; ta.dispatchEvent(new Event('input')); return }
  let i = 0; const tick = () => { ta.value = text.slice(0, i += 3); ta.dispatchEvent(new Event('input')); if (i < text.length) requestAnimationFrame(tick) }; tick()
}
document.addEventListener('keydown', e => {
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); back() }
  else if (e.key === 'Escape') { if (petalsOpen) { petalsOpen = false; renderPetalsState() } else if (accs.length) { accs.shift(); renderAccs(); renderSats() } else back() }
  else if (e.key === 'Enter' && e.target.matches('.row,.hero')) e.target.click()
})
addEventListener('resize', renderPetals)

chain = [{ id: 'oggi', kind: 'list', mem: {} }]; render('morph')
</script>
</body>
